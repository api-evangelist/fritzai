name: Fritz.ai
description: >-
  Fritz.ai was a Boston-based mobile, on-device machine learning platform,
  backed by Uncork Capital, that gave iOS and Android developers SDKs plus a
  hosted service for training, deploying, and managing ML models directly on
  devices. That original developer platform has since wound down, and the
  fritz.ai domain now hosts an unrelated AI-tools review and ranking content
  site (guides, glossary, interviews, and tool comparisons) with no public API,
  SDK, or developer program. This API Evangelist profile was surfaced from the
  Uncork Capital portfolio graph and is retained as a historical company record;
  no live API surface was found during enrichment.
